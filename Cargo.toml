[package]
name = "mbt"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Meta Binary Transparency CLI for independent verification of Meta's transparency log."
repository = "https://github.com/facebook/mbt"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
hex = "0.4"
prost = "0.13"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
